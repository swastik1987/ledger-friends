# Run the Gradle daemon on JDK 21 whatever JAVA_HOME says. Capacitor 8's
# template (AGP 8.13 / Gradle 8.14.3) fails on Android Studio's bundled JDK 25
# ("Unsupported class file major version 69"). Gradle finds JDK 21 among the
# installed JDKs, including IntelliJ/Android Studio downloads in ~/.jdks.
toolchainVersion=21
